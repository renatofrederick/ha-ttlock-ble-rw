name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build HACS archive
        run: (cd custom_components/ttlock_ble && zip -r ../../ttlock_ble.zip .)

      - name: Read release version
        id: version
        run: echo "tag=v$(jq -r .version custom_components/ttlock_ble/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" ttlock_ble.zip --target "${{ github.event.workflow_run.head_sha }}" --generate-notes
